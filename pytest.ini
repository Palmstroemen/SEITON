# pytest.ini (repo root)
[pytest]
# Every test folder (core/archive is old code and stays out). cloud/nextcloud/tests need a
# test server and skip without one.
testpaths = core/tests/unit core/config/tests cli/tests apps/Scope/tests examples/PostFix/tests examples/SunTree/tests
    apps/Headline/tests apps/Time/tests cloud/service/tests cloud/nextcloud/tests installer/tests scripts/tests
pythonpath = .
addopts = -v --tb=short -m "not benchmark"
markers =
    benchmark: timing measurements that depend on the machine; run with -m benchmark
